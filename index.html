<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Client</title>
</head>

<body>
  <h1>Mock Client</h1>

  <section id="login">
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="gameTokenDisplay" style="display:none;">
      Game Token: <span id="gameToken"></span>
    </p>
  </section>

  <section id="gameSelector">
    <h2>Select a Game</h2>
    <input type="text" id="searchGame" placeholder="Search games..." />
    <select id="gameDropdown" size="5" style="width: 300px;" onchange="startGameFromDropdown()"></select>
  </section>

  <section id="socket">
    <input id="serverUrl" placeholder="Server URL" style="width:300px;" />
    <button id="connectBtn" onclick="connectSocket()" disabled>Connect</button>
    <button onclick="disconnectSocket()">Disconnect</button>
    <p>Status: <span id="status">Disconnected</span></p>
  </section>

  <section id="configEditorSection" style="display:none; margin-top:1em;">
    <h3>Game Configuration</h3>
    <textarea id="jsonEditor" rows="20" style="width:100%;"></textarea><br>
    <button id="updateConfigBtn" onclick="updateConfig()" disabled>Update Configuration</button>
  </section>

  <section id="logs">
    <h2>Logs</h2>
    <div id="logContainer" style="height:300px; overflow:auto; border:1px solid #ccc;"></div>
  </section>

  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script>
    let socket;
    let currentToken;
    let isConnected = false;



    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const json = await res.json();
        if (res.ok) {
          currentToken = json.data.accessToken;
          log('Login successful', 'success');
          await fetchGames();
        } else {
          log('Login failed: ' + (json.message || json.error), 'error');
        }
      } catch (err) {
        log('Login error: ' + err.message, 'error');
      }
    }
    async function fetchGames() {
      if (!currentToken) {
        log('Login to fetch games', 'error');
        return;
      }

      try {
        const res = await fetch('/api/games', {
          headers: {
            'Authorization': `Bearer ${currentToken}`,
            'Content-Type': 'application/json'
          },
          credentials: 'include'
        });

        const json = await res.json();
        if (!res.ok) throw new Error(json.message || json.error);

        const games = json.data || json; // Adjust if `json` structure is different
        const dropdown = document.getElementById('gameDropdown');
        dropdown.innerHTML = ''; // Clear existing options


        games.forEach(game => {
          const option = document.createElement('option');
          option.value = game.slug || game.id || game._id || game.name;
          option.textContent = game.slug || game.name || game.title || `Game ${game.id}`;
          dropdown.appendChild(option);
        });

        // Setup search filter
        document.getElementById('searchGame').addEventListener('input', function () {
          const term = this.value.toLowerCase();
          Array.from(dropdown.options).forEach(opt => {
            opt.style.display = opt.textContent.toLowerCase().includes(term) ? '' : 'none';
          });
        });
        log('Games fetched and dropdown populated', 'success');
      } catch (err) {
        log('Error fetching games: ' + err.message, 'error');
      }
    }


    let currentGameToken = null;

    async function startGameFromDropdown() {
      const dropdown = document.getElementById('gameDropdown');
      const selectedOption = dropdown.options[dropdown.selectedIndex];
      if (!selectedOption) {
        log('No game selected', 'error');
        return;
      }

      const slug = selectedOption.value;

      try {
        const res = await fetch(`/api/games/slug/${slug}/play`, {
          headers: {
            'Authorization': `Bearer ${currentToken}`, // login token
            'Content-Type': 'application/json'
          },
          credentials: 'include'
        });

        const json = await res.json();
        if (!res.ok) throw new Error(json.message || json.error);

        const fullUrl = json.data.token || json.token;
        const parsedToken = new URL(fullUrl).searchParams.get('token');
        currentGameToken = parsedToken;

        document.getElementById('gameToken').textContent = currentGameToken;
        document.getElementById('gameTokenDisplay').style.display = 'block';
        log(`Game '${selectedOption.textContent}' started.`, 'success');

        document.getElementById('connectBtn').disabled = false;
      } catch (err) {
        log('Error starting game: ' + err.message, 'error');
      }
    }

    function connectSocket() {
      if (!currentGameToken) {
        log('No game token available. Start a game first.', 'error');
        return;
      }

      try {
        updateStatus('Connecting...');
        log('Connecting to server...', 'info');

        socket = io('http://localhost:5000/playground', {
          transports: ['websocket'],
          auth: {token: currentGameToken}
        });

        socket.on('connect', () => {

          isConnected = true;
          updateStatus('Connected');
          log('Connected to server', 'success');
          document.getElementById('gameControl').style.display = 'block';
        });

        socket.on('disconnect', () => {
          isConnected = false;
          jsonEditor.value = '';
          updateStatus('Disconnected');
          log('Disconnected from server', 'info');
        });

        socket.on('connect_error', (error) => {
          updateStatus('Disconnected');
          log(`Connection error: ${error.message}`, 'error');
        });

        socket.on('error', (error) => {
          log(`Socket error: ${error.message || error}`, 'error');
        });

        socket.on('spin:result', (data) => {
          log(`spin:result - ${JSON.stringify(data)}`, 'received');
        });

        socket.on('game:config', (config) => {
          try {
            jsonEditor.value = JSON.stringify(config, null, 2);
          } catch {
            jsonEditor.value = config;
          }
          configEditorSection.style.display = 'block';
          updateConfigBtn.disabled = false;
          log('Config loaded into editor', 'info');
        });

        socket.onAny((ev, data) => {
          log(`Event [${ev}]: ${ev !== 'game:config' ? JSON.stringify(data) : "JSON"}`, 'received');
        });

      } catch (err) {
        log('Failed to connect: ' + err.message, 'error');
      }
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        updateStatus('Disconnected');
      }
    }


    function sendGameUpdate() {
      const payload = document.getElementById('gameInput').value;
      try {
        const json = JSON.parse(payload);
        socket.emit('game:update', json); // adjust event name as needed
        log('Game update sent', 'success');
      } catch (err) {
        log('Invalid JSON: ' + err.message, 'error');
      }
    }

    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.textContent = `[${type.toUpperCase()}] ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`;
      document.getElementById('logContainer').appendChild(div);
      div.scrollIntoView();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('serverUrl').value =
        localStorage.getItem('mockClient.serverUrl') ||
        'http://localhost:5000/playground';
    });

    window.addEventListener('beforeunload', () => {
      localStorage.setItem('mockClient.serverUrl', document.getElementById('serverUrl').value);
    });


    // AFTER all your functions, but still inside the same <script>…

    // 1. Grab editor elements
    const configEditorSection = document.getElementById('configEditorSection');
    const jsonEditor = document.getElementById('jsonEditor');
    const updateConfigBtn = document.getElementById('updateConfigBtn');

    // 2. Initial state
    configEditorSection.style.display = 'none';
    updateConfigBtn.disabled = true;


    function updateConfig() {

      let updated;
      try {
        updated = JSON.parse(jsonEditor.value);
      } catch (err) {
        log('Invalid JSON: ' + err.message, 'error');
        return;
      }
      socket.emit('game:config:update', updated);
      log('Configuration update sent', 'success');
    }

  </script>
</body>

</html>
