<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Casino Client</title>
</head>
<body>
  <h1>Mock Casino Client</h1>
  
  <section id="login">
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="tokenDisplay" style="display:none;">Token: <span id="token"></span></p>
  </section>

  <section id="socket">
    <input id="serverUrl" placeholder="Server URL" style="width:300px;" />
    <button onclick="connectSocket()">Connect</button>
    <button onclick="disconnectSocket()">Disconnect</button>
    <p>Status: <span id="status">Disconnected</span></p>
  </section>

  <section id="logs">
    <h2>Logs</h2>
    <div id="logContainer" style="height:300px; overflow:auto; border:1px solid #ccc;"></div>
  </section>

  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script>
    let socket;
    let currentToken;

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();
        if (res.ok) {
          currentToken = json.data.accessToken;
          document.getElementById('token').textContent = currentToken;
          document.getElementById('tokenDisplay').style.display = 'block';
          log('Login successful', 'success');
        } else {
          log('Login failed: ' + (json.message || json.error), 'error');
        }
      } catch (err) {
        log('Login error: ' + err.message, 'error');
      }
    }

    function connectSocket() {
      const url = document.getElementById('serverUrl').value;
      if (!url || !currentToken) {
        log('Server URL and token required', 'error');
        return;
      }
      socket = io(url, { transports: ['websocket'], auth: { token: currentToken } });
      document.getElementById('status').textContent = 'Connecting...';

      socket.on('connect', () => updateStatus('Connected'));
      socket.on('disconnect', () => updateStatus('Disconnected'));
      socket.on('error', err => log('Socket error: ' + err.message, 'error'));
      socket.onAny((ev, data) => log(`Event [${ev}]: ${JSON.stringify(data)}`, 'received'));
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        updateStatus('Disconnected');
      }
    }

    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function log(msg, type='info') {
      const div = document.createElement('div');
      div.textContent = `[${type.toUpperCase()}] ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`;
      document.getElementById('logContainer').appendChild(div);
      div.scrollIntoView();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('serverUrl').value =
        localStorage.getItem('mockClient.serverUrl') ||
        'https://csq8tq14-5001.inc1.devtunnels.ms/playground';
    });

    window.addEventListener('beforeunload', () => {
      localStorage.setItem('mockClient.serverUrl', document.getElementById('serverUrl').value);
    });
  </script>
</body>
</html>
