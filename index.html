<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Casino Client</title>
  <style>
    /* Basic Layout Improvements */
    body {
      font-family: Arial, sans-serif;
      margin: 1em;
    }

    section {
      margin-bottom: 1.5em;
    }

    #gameSelectorSection,
    #socketSection,
    #configEditorSection {
      display: flex;
      flex-direction: column;
      max-width: 600px;
    }

    #gameSelectorSection input,
    #socketSection input,
    #jsonEditor {
      margin-bottom: 0.5em;
      padding: 0.5em;
      font-size: 1em;
    }

    #gameDropdown {
      height: 8em;
      margin-bottom: 0.5em;
    }

    button {
      padding: 0.5em 1em;
      font-size: 1em;
      margin-right: 0.5em;
    }

    #logContainer {
      max-width: 600px;
    }
  </style>
</head>

<body>
  <h1>Mock Client</h1>

  <section id="loginSection">
    <h2>Login</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
  </section>

  <section id="gameSelectorSection" hidden>
    <h2>Select Game</h2>
    <input id="searchGame" placeholder="Search games..." />
    <select id="gameDropdown"></select>
  </section>

  <section id="socketSection" hidden>
    <h2>Connection</h2>
    <input id="serverUrl" placeholder="Server URL (e.g. http://localhost:5000/playground)" />
    <div>
      <button id="connectBtn" disabled>Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
    </div>
    <p>Status: <span id="statusText">Disconnected</span></p>
  </section>

  <p id="gameTokenDisplay" hidden>
    <strong>Game Token:</strong> <span id="gameToken"></span>
  </p>

  <section id="configEditorSection" hidden>
    <h2>Configuration Editor</h2>
    <textarea id="jsonEditor" rows="10"></textarea><br>
    <button id="updateConfigBtn" disabled>Update Configuration</button>
  </section>

  <section id="logsSection">
    <h2>Logs</h2>
    <div id="logContainer" style="height:300px; overflow:auto; border:1px solid #ccc;"></div>
  </section>

  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script>
    (function () {
      // Cache DOM elements
      const loginBtn = document.getElementById('loginBtn');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const gameSelectorSection = document.getElementById('gameSelectorSection');
      const searchInput = document.getElementById('searchGame');
      const gameDropdown = document.getElementById('gameDropdown');
      const socketSection = document.getElementById('socketSection');
      const serverUrlInput = document.getElementById('serverUrl');
      const connectBtn = document.getElementById('connectBtn');
      const disconnectBtn = document.getElementById('disconnectBtn');
      const statusText = document.getElementById('statusText');
      const gameTokenDisplay = document.getElementById('gameTokenDisplay');
      const gameTokenSpan = document.getElementById('gameToken');
      const configEditorSection = document.getElementById('configEditorSection');
      const jsonEditor = document.getElementById('jsonEditor');
      const updateConfigBtn = document.getElementById('updateConfigBtn');
      const logContainer = document.getElementById('logContainer');

      // State
      let socket = null;
      let accessToken = null;
      let gameToken = null;
      let isConnected = false;

      // Utilities
      function log(msg, type = 'info') {
        const entry = document.createElement('div');
        entry.textContent = `[${type.toUpperCase()}] ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`;
        logContainer.appendChild(entry);
        entry.scrollIntoView();
      }
      function toggleSection(section, show) {
        section.hidden = !show;
      }
      function updateStatus(connected) {
        isConnected = !!connected;
        statusText.textContent = connected ? 'Connected' : 'Disconnected';
        connectBtn.disabled = connected;
        disconnectBtn.disabled = !connected;
        // Hide editor on disconnect
        if (!connected) toggleSection(configEditorSection, false);
      }

      // API helper
      async function apiFetch(url, opts = {}) {
        const res = await fetch(url, opts);
        const json = await res.json();
        if (!res.ok) throw new Error(json.message || json.error || 'Request failed');
        return json;
      }

      // Login
      loginBtn.addEventListener('click', async () => {
        try {
          const {data} = await apiFetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              username: usernameInput.value,
              password: passwordInput.value
            }),
            credentials: 'include'
          });

          accessToken = data.accessToken;
          log('Logged in', 'success');
          toggleSection(gameSelectorSection, true);
          await loadGames();
        } catch (err) {
          log(err.message, 'error');
        }
      });

      // Load games
      async function loadGames() {
        try {
          const {data} = await apiFetch('/api/games', {
            headers: {'Authorization': `Bearer ${accessToken}`},
            credentials: 'include'
          });
          populateGames(data);
        } catch (err) {
          log('Fetch games error: ' + err.message, 'error');
        }
      }
      function populateGames(games) {
        gameDropdown.innerHTML = '';
        games.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.slug;
          opt.textContent = g.name || g.slug;
          gameDropdown.appendChild(opt);
        });
      }

      // Filter games
      searchInput.addEventListener('input', () => {
        const term = searchInput.value.toLowerCase();
        gameDropdown.querySelectorAll('option').forEach(opt => {
          opt.hidden = !opt.textContent.toLowerCase().includes(term);
        });
      });

      // Start game
      gameDropdown.addEventListener('change', async () => {
        try {
          const slug = gameDropdown.value;
          const {data} = await apiFetch(`/api/games/slug/${slug}/play`, {
            headers: {'Authorization': `Bearer ${accessToken}`},
            credentials: 'include'
          });

          gameToken = new URL(data.token).searchParams.get('token');
          gameTokenSpan.textContent = gameToken;

          toggleSection(gameTokenDisplay, true);
          toggleSection(socketSection, true);
          connectBtn.disabled = false;
          serverUrlInput.value = serverUrlInput.value || 'http://localhost:5000/playground';

          log(`Game ${slug} started`, 'success');
        } catch (err) {
          log('Start game error: ' + err.message, 'error');
        }
      });

      // Socket connect/disconnect
      connectBtn.addEventListener('click', () => {
        socket = io(serverUrlInput.value, {transports: ['websocket'], auth: {token: gameToken}});

        socket.on('connect', () => updateStatus(true));
        socket.on('disconnect', () => updateStatus(false));
        socket.on('game:config', cfg => {
          jsonEditor.value = JSON.stringify(cfg, null, 2);
          toggleSection(configEditorSection, true);
          log('Config loaded', 'info');
        });
        socket.onAny((ev, data) => log(`Event [${ev}]: ${JSON.stringify(data)}`, 'received'));
      });
      disconnectBtn.addEventListener('click', () => socket && socket.disconnect());

      jsonEditor.addEventListener('input', () => {
        try {
          JSON.parse(jsonEditor.value);
          updateConfigBtn.disabled = false;
        } catch (e) {
          updateConfigBtn.disabled = true;
        }
      });

      // Update config
      updateConfigBtn.addEventListener('click', () => {
        if (!socket || !isConnected) return log('Not connected', 'error');
        try {
          const updated = JSON.parse(jsonEditor.value);
          socket.emit('game:config:update', updated);
          log('Config update sent', 'sent');
        } catch (e) {
          log('Invalid JSON: ' + e.message, 'error');
        }
      });

    })();
  </script>
</body>

</html>
